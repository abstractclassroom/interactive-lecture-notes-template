name: Publish to AbstractClassroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: abstractclassroom-content-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository != 'abstractclassroom/interactive-lecture-notes-template'
    name: Sync and validate lesson content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ABSTRACTCLASSROOM_AUDIENCE: abstractclassroom-interactive-lecture-notes
      ABSTRACTCLASSROOM_ENDPOINT: https://preview.abstractclassroom.com/api/interactive-lecture-notes/github/workflow
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate with OIDC and publish course content
        run: python3 .github/scripts/sync-content.py
