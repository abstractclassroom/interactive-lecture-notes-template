name: Connect to AbstractClassroom

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  connect:
    name: Verify repository connection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ABSTRACTCLASSROOM_AUDIENCE: abstractclassroom-interactive-lecture-notes
      ABSTRACTCLASSROOM_ENDPOINT: https://preview.abstractclassroom.com/api/interactive-lecture-notes/github/workflow
    steps:
      - name: Authenticate repository with AbstractClassroom
        shell: bash
        run: |
          set -euo pipefail
          oidc_response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${ABSTRACTCLASSROOM_AUDIENCE}")"
          oidc_token="$(jq -er '.value' <<< "${oidc_response}")"
          response_file="${RUNNER_TEMP}/abstractclassroom-workflow-response.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${oidc_token}" \
            --header "Accept: application/json" \
            --output "${response_file}" \
            "${ABSTRACTCLASSROOM_ENDPOINT}"
          if [[ "$(jq -r '.recognized // false' "${response_file}")" == "true" ]]; then
            echo "AbstractClassroom connected this repository to the registered course."
          else
            echo "This repository is not registered with AbstractClassroom. No action was taken."
          fi
